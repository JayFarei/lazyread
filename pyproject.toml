[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "listen-read"
version = "0.1.0"
description = "Local-first listening library runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Listen Read contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/JayFarei/listen-read"
Repository = "https://github.com/JayFarei/listen-read"
Issues = "https://github.com/JayFarei/listen-read/issues"

[project.scripts]
listen-read = "listen_read.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/listen_read"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "listen_read/web"
"assets/reader-template/scripts/generate_audio.py" = "listen_read/worker_template/scripts/generate_audio.py"
"skills/listen-read" = "listen_read/skills/listen-read"
"skills/defuddle" = "listen_read/skills/defuddle"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/web/dist",
  "/assets/reader-template/scripts/generate_audio.py",
  "/skills",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
