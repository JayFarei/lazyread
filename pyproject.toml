[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lazyreader-local"
version = "0.1.0"
description = "Lazyreader local-first listening library runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lazyreader contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/JayFarei/lazyreader"
Repository = "https://github.com/JayFarei/lazyreader"
Issues = "https://github.com/JayFarei/lazyreader/issues"

[project.scripts]
lazyreader = "lazyreader.cli:entrypoint"
# One-release compatibility alias for previously installed agent skills.
listen-read = "lazyreader.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.hatch.build]
# Keep the source tree ahead of force-included runtime assets in editable installs.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/lazyreader"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "lazyreader/web"
"assets/reader-template/scripts/generate_audio.py" = "lazyreader/worker_template/scripts/generate_audio.py"
"skills/lazyreader" = "lazyreader/skills/lazyreader"
"skills/defuddle" = "lazyreader/skills/defuddle"
"packaging/worker-requirements.lock" = "lazyreader/worker-requirements.lock"
"packaging/defuddle/package.json" = "lazyreader/defuddle-package/package.json"
"packaging/defuddle/package-lock.json" = "lazyreader/defuddle-package/package-lock.json"
"THIRD_PARTY_NOTICES.md" = "lazyreader/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/web/dist",
  "/assets/reader-template/scripts/generate_audio.py",
  "/skills",
  "/packaging",
  "/README.md",
  "/RELEASING.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
