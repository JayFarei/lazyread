[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lazyread"
version = "0.2.0"
description = "Lazyread local-first listening library runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lazyread contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/JayFarei/lazyread"
Repository = "https://github.com/JayFarei/lazyread"
Issues = "https://github.com/JayFarei/lazyread/issues"

[project.scripts]
lazyread = "lazyread.cli:entrypoint"
# One-release compatibility alias for previously installed agent skills.
lazyreader = "lazyread.cli:entrypoint"
listen-read = "lazyread.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.hatch.build]
# Keep the source tree ahead of force-included runtime assets in editable installs.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/lazyread"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "lazyread/web"
"assets/reader-template/scripts/generate_audio.py" = "lazyread/worker_template/scripts/generate_audio.py"
"skills/lazyread" = "lazyread/skills/lazyread"
"skills/defuddle" = "lazyread/skills/defuddle"
"packaging/worker-requirements.lock" = "lazyread/worker-requirements.lock"
"packaging/defuddle/package.json" = "lazyread/defuddle-package/package.json"
"packaging/defuddle/package-lock.json" = "lazyread/defuddle-package/package-lock.json"
"THIRD_PARTY_NOTICES.md" = "lazyread/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/web/dist",
  "/assets/reader-template/scripts/generate_audio.py",
  "/skills",
  "/packaging",
  "/README.md",
  "/RELEASING.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
