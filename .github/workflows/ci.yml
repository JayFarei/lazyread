name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --extra test --locked
      - run: uv run pytest
      - run: uvx ruff check src tests
      - run: uv build
      - name: Smoke-test wheel contents
        run: unzip -l dist/*.whl | grep -E 'listen_read/(web/index.html|skills/listen-read/SKILL.md|worker_template/scripts/generate_audio.py)'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
