name: Publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(uv version --short)" = "$RELEASE_TAG"
      - name: Build embedded web application
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke-test wheel installation
        run: uv run --isolated --no-project --with dist/*.whl tests/package_smoke.py
      - name: Smoke-test source distribution installation
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/package_smoke.py
      - name: Publish to PyPI with trusted publishing
        run: uv publish
